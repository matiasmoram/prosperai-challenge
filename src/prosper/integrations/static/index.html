<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prosper · Front Desk</title>
  <style>
    :root {
      --ink: #1c2530;
      --muted: #6b7785;
      --line: #e2e7ee;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --brand: #0f2a43;
      --accent: #2563eb;
      --sel: #eaf2ff;
    }
    * { box-sizing: border-box; }
    body {
      font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; color: var(--ink); background: var(--bg);
    }

    /* ---- header / tabs ---- */
    header {
      background: var(--brand); color: #fff; padding: 0 16px;
      display: flex; gap: 8px; align-items: center; height: 52px;
    }
    header .brand { font-weight: 600; font-size: 15px; letter-spacing: .2px; }
    header .brand .dot { color: #6fa8dc; margin: 0 6px; }
    .tabs { margin-left: 20px; display: flex; gap: 2px; }
    .tabs button {
      font: inherit; border: 0; background: transparent; color: #b9cee0;
      padding: 16px 14px; cursor: pointer; border-bottom: 3px solid transparent;
    }
    .tabs button:hover { color: #fff; }
    .tabs button.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }

    main { height: calc(100vh - 52px); }

    /* ---- mail ---- */
    #mail-view { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
    #list { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
    .list-empty { padding: 22px; color: var(--muted); }
    .row {
      padding: 11px 14px; border-bottom: 1px solid #eef1f4; cursor: pointer;
      display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: start;
    }
    .row:hover { background: #f5f9ff; }
    .row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
    .row .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
    .row .subj { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .to { color: var(--muted); font-size: 12px; margin-top: 2px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .time { color: var(--muted); font-size: 11px; white-space: nowrap; }

    .dot-booking_confirmation { background: #16a34a; }
    .dot-handoff { background: #d97706; }
    .dot-bot_failed { background: #dc2626; }
    .dot-default { background: #94a3b8; }

    #detail { padding: 26px; overflow: auto; }
    .detail-empty { color: var(--muted); }
    .email { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
             padding: 22px 24px; max-width: 720px; }
    .email .tag {
      display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .3px;
      text-transform: uppercase; padding: 2px 8px; border-radius: 10px; margin-bottom: 12px;
    }
    .tag-booking_confirmation { background: #dcfce7; color: #166534; }
    .tag-handoff { background: #fef3c7; color: #92400e; }
    .tag-bot_failed { background: #fee2e2; color: #991b1b; }
    .tag-default { background: #eef1f4; color: #475569; }
    .email h2 { margin: 0 0 4px; font-size: 19px; }
    .email .to-line { color: var(--muted); font-size: 13px; border-bottom: 1px solid #eef1f4;
                      padding-bottom: 14px; margin-bottom: 16px; }
    .email pre { white-space: pre-wrap; font: inherit; margin: 0; }
    .email .footer { margin-top: 18px; padding-top: 12px; border-top: 1px solid #eef1f4;
                     color: var(--muted); font-size: 12px; }

    /* ---- calendar ---- */
    #cal-view { height: 100%; display: flex; flex-direction: column; }
    .cal-bar { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
               display: flex; align-items: baseline; gap: 10px; }
    .cal-bar .title { font-weight: 600; font-size: 15px; }
    .cal-bar .sub { color: var(--muted); font-size: 12px; }
    .cal-empty { padding: 32px; color: var(--muted); }
    .cal-grid { flex: 1; overflow: auto; display: grid;
                grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 1px;
                background: var(--line); }
    .cal-col { background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
    .cal-col.today .day-head { background: #eaf2ff; color: var(--accent); }
    .day-head { position: sticky; top: 0; background: var(--panel); z-index: 1;
                padding: 10px 10px 8px; border-bottom: 1px solid var(--line); }
    .day-head .dow { font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
                     color: var(--muted); }
    .day-head .dnum { font-size: 18px; font-weight: 600; }
    .day-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .day-body .none { color: #c2cad3; text-align: center; padding-top: 14px; font-size: 18px; }
    .event {
      border-radius: 6px; padding: 7px 9px; border-left: 4px solid var(--ev-accent, #94a3b8);
      background: var(--ev-bg, #eef1f4); color: var(--ink);
    }
    .event .etime { font-weight: 700; font-size: 13px; }
    .event .epat { font-weight: 600; margin-top: 1px; overflow: hidden;
                   text-overflow: ellipsis; white-space: nowrap; }
    .event .eprov { font-size: 12px; color: #455; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
    .event .espec { font-size: 11px; color: var(--ev-accent, #64748b); font-weight: 600;
                    margin-top: 2px; }

    /* Authoritative: id selectors (#mail-view/#cal-view) set `display`, which
       out-specifies a bare `.hidden`, so the tab toggle needs !important. */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <span class="brand">Prosper<span class="dot">·</span>Front Desk</span>
    <span class="tabs">
      <button id="tab-mail" class="active">Mail</button>
      <button id="tab-cal">Calendar</button>
    </span>
  </header>

  <main>
    <section id="mail-view">
      <div id="list"></div>
      <div id="detail"><p class="detail-empty">Select a message.</p></div>
    </section>

    <section id="cal-view" class="hidden">
      <div class="cal-bar">
        <span class="title">This week</span>
        <span class="sub" id="cal-range"></span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>
  </main>

  <script src="/frontdesk/static/frontdesk.js"></script>
</body>
</html>
