[project]
name = "prosper-challenge"
version = "0.1.0"
description = "Voice agent + EHR for the Prosper Health challenge"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[webrtc,silero,elevenlabs,openai,local-smart-turn-v3,runner]",
    "pipecat-ai-cli",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
    "openai>=1.55",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "aiofiles>=24.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "pre-commit>=4.0",
    "pytest-cov>=7.1.0",
    "mutmut>=3.5.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "E", "F", "W", "B", "UP", "ARG", "SIM", "RET", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"src/prosper/ehr/api.py" = ["B008"]  # FastAPI dependency-injection pattern
"src/prosper/integrations/router.py" = ["B008"]  # FastAPI Query() in default args — same pattern
"src/prosper/result.py" = ["UP007"]  # TypeVar with X | Y requires PEP 695 in 3.12+
"src/prosper/ehr/db.py" = ["S101"]  # assert used as None-narrowing for `_SessionLocal`
"src/prosper/ehr_client.py" = ["S101"]  # assert narrows Optional[AsyncClient] inside `_c()`
"src/prosper/prompts.py" = ["RUF001"]  # en-dash is intentional in user-facing voice copy
"src/prosper/bot.py" = ["E402"]  # env-check intentionally precedes the 17s pipecat import wall
"tests/*" = ["S101", "ARG"]  # pytest uses `assert`; mock callbacks accept unused fixture params
"evals/*" = ["S101", "ARG"]  # eval scenarios use `assert`; setup-lambdas have fixed signatures
"tester/*" = ["S101", "ARG"]  # prototype test harness: pytest `assert`; parametrized fixtures

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "audio: full-pipeline audio smoke tests (slow, ElevenLabs credits required)",
    "live: tests that hit real external services (skipped without credentials)",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
