[project]
name = "prosper-challenge"
version = "0.1.0"
description = "Voice agent + EHR for the Prosper Health challenge"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[webrtc,silero,elevenlabs,openai,local-smart-turn-v3,runner]",
    "pipecat-ai-cli",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.10",
    "openai>=1.55",
    "loguru>=0.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "E", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "audio: full-pipeline audio smoke tests (slow, ElevenLabs credits required)",
    "live: tests that hit real external services (skipped without credentials)",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
